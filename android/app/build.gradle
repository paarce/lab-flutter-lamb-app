plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.accessibilityapp.lamb"
    compileSdk = 35  // Compatible con flutter_webrtc 0.9.48
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Application ID para la app de accesibilidad
        applicationId = "com.accessibilityapp.lamb"

        // Android 7.0 Nougat (API 24) - Versión mínima requerida
        minSdk = 24

        // Android 13 (API 33) - Versión objetivo (downgrade temporal para MVP)
        // Android 14+ requiere foreground service complejo para MediaProjection
        // Para producción, usar targetSdk 34 con ScreenCaptureService
        targetSdk = 33

        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Habilitar multidex (necesario para Firebase)
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // Signing with the debug keys for now, so `flutter run --release` works.
            // Production signing config will be added as part of FUNCIONALIDAD 7 (Release Configuration)
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Agregar dependencias necesarias para la app
dependencies {
    // Multidex para Firebase
    implementation 'androidx.multidex:multidex:2.0.1'
}

// Google Services (debe estar al final del archivo)
// Se necesita tener google-services.json en android/app/
apply plugin: 'com.google.gms.google-services'
